server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Адрес backend берётся из DNS Docker в момент запроса. С адресом, прописанным прямо
    # в proxy_pass, nginx резолвил его один раз при старте: после пересоздания контейнера
    # backend (docker compose up -d --build backend) IP менялся, и /api отвечал 502,
    # пока не перезапустить frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # proxy_pass без URI передаёт путь и query string запроса без изменений.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass $backend;
        access_log off;
    }

    location = /ready {
        proxy_pass $backend;
        access_log off;
    }

    location = /metrics {
        proxy_pass $backend;
        access_log off;
    }

    location = /docs {
        proxy_pass $backend;
    }

    location = /openapi.json {
        proxy_pass $backend;
    }

    # Файлы сборки Vite с хешем в имени не меняются — кэшируем надолго. Отсутствующий
    # файл должен давать 404, а не index.html: иначе браузер получал HTML вместо JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html браузер перепроверяет при каждом заходе, чтобы после обновления
    # не открыть старую страницу со ссылками на уже удалённые файлы сборки.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
